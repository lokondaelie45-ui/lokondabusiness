<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Lokonda Business</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">
  <div class="bg-slate-800 p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-700">
    <h1 class="text-2xl font-bold mb-6 text-center text-amber-400">Connexion</h1>
    
    <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
      <div>
        <label class="block text-sm font-medium mb-1">Courriel</label>
        <input type="email" id="email" required placeholder="votre@email.com" class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-amber-400 text-white">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Mot de passe</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-amber-400 text-white">
      </div>
      <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded-lg transition">
        Se connecter
      </button>
    </form>

    <p class="text-center text-sm text-slate-400 mt-6">
      <a href="index.html" class="underline hover:text-white">← Retour à l'accueil</a>
    </p>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      alert("Connexion réussie ! Redirection vers l'accueil...");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
